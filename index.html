  const link = boardLink();
  $("sheetRoot").innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(AGENT())}'s board">
    <div class="hd"><h3>${esc(AGENT())}'s board</h3><button class="close" id="closeSheet" type="button" aria-label="Close">×</button></div>
    <div class="sc" id="sheetScroll">
      <div class="box"><h4>Homes</h4>${top.map(row).join("")}${others.length?`<details style="margin-top:6px"><summary style="font-size:13px;color:var(--muted);cursor:pointer">Other homes (${others.length})</summary>${others.map(row).join("")}</details>`:""}</div>
      ${board && board.slotAsk ? `<div class="dupb" style="border-radius:12px;margin:0 0 10px">🙋 <b>${esc(AGENT())} asked for more viewing slots</b>${board.slotAsk.note ? ` — “${esc(board.slotAsk.note)}”` : ""} <span class="muted">· ${esc(ago(board.slotAsk.at))}</span><br><span class="muted" style="font-size:12.5px">Add a time below and the request clears.</span></div>` : ""}
      <div class="box"><h4>Our availability</h4><p style="font-size:12.5px;color:var(--muted);margin:0 0 4px">Shown at the top of ${esc(AGENT())}'s board, with viewings already booked in each window (1 hour each). Past times drop off by themselves.</p>
        ${availabilityHTML(sheet.free, true)}
        <form id="slotForm"><div class="slotform" style="font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:-4px"><span>Date</span><span>From</span><span>To</span></div><div class="slotform"><input id="slotDate" type="date" min="${ymd(new Date())}" aria-label="Date"><input id="slotStart" type="time" value="10:00" step="900" aria-label="From"><input id="slotEnd" type="time" value="13:00" step="900" aria-label="To"></div>
          <div class="addtag"><input id="slotNote" placeholder="Note (optional), e.g. Shernice can't join" maxlength="40" autocomplete="off"><button class="btn sm" type="submit">Add</button></div></form></div>
      <button class="btn primary" type="button" id="sendAsk" style="width:100%;justify-content:center;padding:12px;margin-top:12px" ${nNew || freeChanged ? "" : "disabled"}>${nNew ? `Add ${nNew} home${nNew>1?"s":""} & send on WhatsApp` : "Save availability"}</button>
      <p style="font-size:12px;color:var(--muted);margin:8px 2px 0">${nNew ? `WhatsApp opens with a short message for ${esc(AGENT())} listing the new homes and his board link (your free times stay on the board).` : `Time changes and updates reach ${esc(AGENT())}'s board quietly — he sees what changed next time he opens it.`} He only sees the homes on his board, their listing links, your free times and offers you make.</p>
      ${link ? `<div class="box"><h4>His board link</h4><div class="chips"><button class="btn sm" type="button" id="copyBoard">Copy link</button><a class="btn sm" href="${esc(link.replace("agent.html#", "agent.html?preview=1#"))}">Open as ${esc(AGENT())}</a><button class="btn sm danger" type="button" id="resetBoard">${sheet.confirmReset ? "Tap again to reset" : "Reset link"}</button></div>
        <p style="font-size:12px;color:var(--muted);margin:8px 0 0">Reset if the link is ever shared by mistake: the old link stops working and WhatsApp opens with the new one.</p></div>` : ""}
    </div></div>`;
  $("scrim").onclick = closeSheet; $("closeSheet").onclick = closeSheet;
  $("slotForm").onsubmit = ev => { ev.preventDefault();
    const w = {date:$("slotDate").value, start:$("slotStart").value, end:$("slotEnd").value, note:$("slotNote").value.trim()};
    if(!w.date){ toast("Pick a date"); return; } if(!w.start || !w.end || toMin(w.end) - toMin(w.start) < VIEW_MIN){ toast("End time should be at least an hour after the start"); return; }
    if(winEnded(w)){ toast("That time has already passed"); return; }
    sheet.free.push(w); sheet.free.sort((a,b) => (typeof a === "string" ? "" : a.date + a.start).localeCompare(typeof b === "string" ? "" : b.date + b.start)); keepScroll(renderAskSheet); saveFreeNow(); };
  document.querySelectorAll("[data-asksel]").forEach(cb => cb.onchange = () => { cb.checked ? sheet.sel.add(cb.dataset.asksel) : sheet.sel.delete(cb.dataset.asksel); keepScroll(renderAskSheet); });
  document.querySelectorAll("[data-rmwin]").forEach(b => b.onclick = () => { sheet.free.splice(+b.dataset.rmwin, 1); keepScroll(renderAskSheet); saveFreeNow(); });
  $("sendAsk").onclick = sendAsk;
  const cp = $("copyBoard"); if(cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(link); toast("Link copied"); } catch(e){ toast(link); } };
  const rs = $("resetBoard"); if(rs) rs.onclick = () => { if(!sheet.confirmReset){ sheet.confirmReset = true; keepScroll(renderAskSheet); return; } resetBoard(); };
}
// Availability changes save straight away (no separate Save tap needed) once the board exists.
async function saveFreeNow(){
  if(!agent || !agent.boardToken || !board) return;
  try { await restPatch("hs_board/" + agent.boardToken, {free: sheet.free.filter(w => !winEnded(w)), slotAsk: null}); toast("Saved to " + AGENT() + "'s board"); }
  catch(e){ toast("Couldn't save availability — tap Save availability to retry"); }
}
function waOpen(text){ location.href = "https://wa.me/" + String(agent.phone || "").replace(/\D/g, "") + "?text=" + encodeURIComponent(text); }
async function sendAsk(){
  const btn = $("sendAsk"); btn.disabled = true; btn.textContent = "Saving…";
  const add = [...sheet.sel].map(id => units.find(u => u.id === id)).filter(u => u && !onBoard(u.id));
  try {
    const firstTime = !(agent && agent.boardToken && board);
    const token = await ensureBoard();
    const now = new Date().toISOString(), flat = {free: sheet.free.filter(w => !winEnded(w))};
    add.forEach(u => {
      const d = deriveItem(u);
      flat[`items.${u.id}`] = {name:u.name||"", area:(u.area||"").split("·")[0].trim(), url:u.url||"", addedAt:now, status:d.status, appt:d.appt, closedReason:"", ourOffer:null, changedAt:now, changeNote:"New — added by " + NAME[me.key], priority:priorityOf(u), ask:askOf(u), spec:specOf(u)};
    });
    await restPatch("hs_board/" + token, flat);
    if(!add.length){ toast("Availability saved to " + AGENT() + "'s board"); closeSheet(); return; }
    const hr = new Date().getHours(), tod = hr < 12 ? "morning" : hr < 18 ? "afternoon" : "evening";
    const L = [`Hi ${tod} ${AGENT()},`, ""];
    L.push(firstTime ? `We've set up a board for you with ${add.length > 1 ? add.length + " homes" : "a home"} we'd like to view:` : `We've added ${add.length > 1 ? add.length + " homes" : "a home"} to your board:`);
    add.forEach((u,i) => L.push(`${i+1}. ${u.name}${u.url ? "\n   " + u.url : ""}`));
    L.push("", "Your board:", boardLink());
    L.push("", "Thanks!");
    closeSheet(); waOpen(L.join("\n"));
  } catch(e){ toast("Couldn't save — check your connection and try again"); btn.disabled = false; btn.textContent = "Try again"; }
}
async function resetBoard(){
  try {
    const old = agent.boardToken, token = randToken(32);
    const keep = Object.assign({}, board, {createdAt:new Date().toISOString(), resetFrom:"", active:true});
    delete keep.agentSeenAt; delete keep.replyAt;
    await restPatch("hs_board/" + token, keep, {create:true});
    await restPatch("hs_meta/agent", {boardToken: token});
    await restDelete("hs_board/" + old);
    agent = Object.assign({}, agent, {boardToken: token});
    closeSheet();
    waOpen(`Hi ${AGENT()}, it's ${NAME[me.key]} 🙂 Here's a fresh link to our board (the old one no longer works):\n${boardLink()}`);
  } catch(e){ toast("Couldn't reset — try again"); }
}

/* "Andrew updated the board" banner + summary sheet */
const boardFresh = () => board && board.replyAt && millis(board.replyAt) > ((board.seenBy || {})[me.key] || 0);
function boardSummary(){
  const R = (board && board.replies) || {}, n = Object.values(R);
  const c = n.filter(x => x.state === "confirmed" && x.appt).length, v = n.filter(x => (x.view||"").trim()).length, o = n.filter(x => x.counter && typeof x.counter.amountM === "number").length;
  return [c ? `${c} viewing${c>1?"s":""} confirmed` : "", v ? `views on ${v}` : "", o ? `${o} counter-offer${o>1?"s":""}` : "", (board.suggestions||[]).length ? `${board.suggestions.length} suggestion${board.suggestions.length>1?"s":""}` : ""].filter(Boolean).join(", ") || "tap to see";
}
function openReply(){
  if(!board) return;
  sheet = {type:"reply"};
  if(board.replyAt) restPatch("hs_board/" + agent.boardToken, {["seenBy." + me.key]: millis(board.replyAt)}).catch(()=>{});
  renderSheet(true);
}
function renderReplySheet(){
  if(!board){ closeSheet(); return; }
  const R = board.replies || {}, items = Object.entries(board.items || {});
  const order = ["offer","upcoming","new","viewed","closed"];
  items.sort((a,b) => order.indexOf(a[1].status) - order.indexOf(b[1].status));
  $("sheetRoot").innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(AGENT())}'s board">
    <div class="hd"><h3>${esc(AGENT())}'s updates</h3><button class="close" id="closeSheet" type="button" aria-label="Close">×</button></div>
    <div class="sc" id="sheetScroll">
      ${board.agentNote ? `<div class="box"><h4>His note</h4><div class="notes">${esc(board.agentNote)}</div></div>` : ""}
      <div class="box"><h4>Homes on his board</h4>${items.map(([id, it]) => { const r = R[id] || {}; return `<div class="reply"><b>${esc(it.name)}</b> <span class="pill st-Unviewed" style="margin-left:4px">${esc(SECTION[it.status]||"")}</span>
        <div style="color:var(--muted);font-size:13px;margin-top:2px">${esc(RSTATE[r.state] || "No update yet")}${r.state==="confirmed"&&r.appt?" · "+esc(fmtWhen(r.appt)):""}${it.ourOffer?` · our offer ${esc(fmtM(it.ourOffer.amountM))}`:""}${r.counter&&typeof r.counter.amountM==="number"?` · counter ${esc(fmtM(r.counter.amountM))}`:""}</div>
        ${(r.view||"").trim()?`<div style="margin-top:4px">“${esc(r.view.trim())}”</div>`:""}<div style="margin-top:6px"><button class="btn sm" type="button" data-open="${esc(id)}">Open home</button></div></div>`; }).join("") || `<div style="color:var(--muted);font-size:13px">Nothing on his board yet.</div>`}</div>
      ${(board.suggestions||[]).length ? `<div class="box"><h4>His suggestions</h4>${board.suggestions.map(s => `<div class="reply"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\/(www\.)?/,"").slice(0,60))} ↗</a>${s.note?`<div style="margin-top:4px">“${esc(s.note)}”</div>`:""}</div>`).join("")}<p style="font-size:12px;color:var(--muted);margin:6px 0 0">These are sent to Claude's research and appear in Homes, marked "Suggested by ${esc(AGENT())}".</p></div>` : ""}
    </div></div>`;
  $("scrim").onclick = closeSheet; $("closeSheet").onclick = closeSheet;
}

/* Our offer on a home (shown in its details) */
function offerBox(r){
  const o = r.offer, c = r.counter, hist = r.offerHistory || [];
  return `<div class="box"><h4>Offer</h4>
    ${o ? `<div style="font-size:14px"><b>Our offer: ${esc(fmtM(o.amountM))}</b> <span style="color:var(--muted)">· ${esc(NAME[o.by]||"")} ${esc(ago(o.at))}</span>${o.note?`<div style="color:var(--muted);font-size:13px">${esc(o.note)}</div>`:""}</div>` : `<div style="color:var(--muted);font-size:13px">No offer yet.</div>`}
    ${c && typeof c.amountM === "number" ? `<div style="font-size:14px;margin-top:8px"><b style="color:var(--rose)">Seller's counter: ${esc(fmtM(c.amountM))}</b> <span style="color:var(--muted)">· via ${esc(AGENT())} ${esc(ago(c.at))}</span>${c.note?`<div style="color:var(--muted);font-size:13px">${esc(c.note)}</div>`:""}</div>` : ""}
    ${hist.length > 1 ? `<details style="margin-top:6px"><summary style="font-size:12.5px;color:var(--muted);cursor:pointer">Offer history (${hist.length})</summary>${hist.map(h => `<div style="font-size:12.5px;color:var(--muted)">${esc(h.kind === "counter" ? "Seller counter" : "Our offer")} ${esc(fmtM(h.amountM))} · ${esc(new Date(h.at).toLocaleDateString("en-SG",{day:"numeric",month:"short"}))}</div>`).join("")}</details>` : ""}
    <form class="form" id="offerForm" style="margin-top:10px"><label>${o ? "New offer" : "Offer"} (S$)<input id="offerAmt" inputmode="decimal" placeholder="e.g. 2,650,000 or 2.65M"></label><label>Note to seller (optional)<input id="offerNote" maxlength="120" placeholder="e.g. 3-month completion"></label>
      <div class="w"><button class="btn primary sm" type="submit">Save offer</button> <span style="font-size:12px;color:var(--muted)">${board && board.items && board.items[r.id] ? `Shown to ${esc(AGENT())} on his board.` : `Add this home to ${esc(AGENT())}'s board to share it with him.`}</span></div></form></div>`;
}
function wireOffer(r){
  const f = $("offerForm"); if(!f) return;
  f.onsubmit = ev => { ev.preventDefault(); const m = parseMoney($("offerAmt").value); if(!m || m < 0.3 || m > 10){ toast("Enter the offer, e.g. 2,650,000 or 2.65M"); return; }
    const at = new Date().toISOString(), o = {amountM:m, note:$("offerNote").value.trim(), at, by:me.key};
    save(r.id, {offer:o, status:"Offer", offerHistory:FV.arrayUnion({kind:"offer", amountM:m, at, by:me.key})}, "Offer saved — " + fmtM(m));
    addComment(r.id, me.key, `Offered ${fmtM(m)}${o.note ? " — " + o.note : ""}`).catch(()=>{});
  };
}
async function addComment(id, by, text){
  const at = new Date().toISOString();
  const u = units.find(x => x.id === id); logAct(null, {kind:"comment", by, unitId:id, unitName:(u && u.name)||"", text:text.slice(0,300), actAt:at});
  await unitRef(id).collection("comments").add({by, text, at});
  await unitRef(id).update({commentCount:FV.increment(1), lastComment:{by, text:text.slice(0,140), at}});
}

/* ---------- Events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,[data-open]"); if(!t || !me) return;
  if(t.classList.contains("tab")){ if(t.dataset.tab === "sale"){ openSale(); return; } tab = t.dataset.tab; try{localStorage.setItem("hs-tab",tab);}catch(e){} render(); window.scrollTo(0,0); return; }
  if(t.id === "askBtn"){ openAsk(); return; }
  if(t.id === "bellBtn"){ openActivity(); return; }
  if(t.dataset.clwhy){ const id = t.dataset.clwhy; openWhy.has(id) ? openWhy.delete(id) : openWhy.add(id); if(sheet && sheet.type === "unit") keepScroll(renderSheet); else { const y = window.scrollY; render(); window.scrollTo(0, y); } return; }
  if(t.id === "badgeBtn"){ enableBadge(); return; }
  if(t.dataset.gotab){ tab = t.dataset.gotab; try{localStorage.setItem("hs-tab",tab);}catch(e){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.saleopen){ openSale(); return; }
  if(t.dataset.salerm){ removeCompeting(+t.dataset.salerm); return; }
  if(t.dataset.salemore){ saleAll = !saleAll; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if(t.id === "openCmp"){ sheet = {type:"cmp"}; renderSheet(true); return; }
  if(t.dataset.actopen){ openUnit(t.dataset.actopen, t.dataset.chat === "1"); return; }
  if(t.dataset.actf){ sheet.f = t.dataset.actf; renderActivitySheet(); return; }
  if(t.dataset.reply){ openReply(); return; }
  if(t.dataset.dup){ sheet = {type:"dup", id:t.dataset.dup, q:""}; renderSheet(true); return; }
  if(t.dataset.dupyes){ mergeInto(t.dataset.dupyes, t.dataset.into); return; }
  if(t.dataset.toboard){ const id = t.dataset.toboard; openAsk(); sheet.sel = new Set([id]); renderSheet(true); return; }
  if(t.dataset.sharec){ shareOld(t.dataset.sharec); return; }
  if(t.dataset.dropyes){ const u = units.find(x => x.id === t.dataset.dropyes), d = (u && u.agentDrop) || {};
    save(u.id, {status:"Rejected", appt:"", rejectReason:`${AGENT()}: ${d.reason || "suggested dropping"}${d.note ? " (" + d.note + ")" : ""}`, "agentDrop.decided":"drop"}, "Dropped — moved to Rejected"); return; }
  if(t.dataset.dropkeep){ save(t.dataset.dropkeep, {"agentDrop.decided":"keep"}, "Kept — " + AGENT() + " will see you'd like to keep it"); return; }
  if(t.dataset.plan){ openPlan(t.dataset.plan); return; }
  if(t.dataset.afile){ openAgentFile(t.dataset.afile, t.dataset.unit); return; }
  if(t.dataset.useplan){ useAsPlan(t.dataset.useplan, t.dataset.unit); return; }
  if(t.dataset.rmfile){ removeAgentFile(t.dataset.rmfile, t.dataset.unit); return; }
  if(t.dataset.planadd){ pickPlan(t.dataset.planadd); return; }
  if(t.dataset.relist){ save(t.dataset.relist, {listingState:"Live"}, "Back in play"); return; }
  if(t.dataset.dupno){ save(t.dataset.dupno, {dupOf:null, dupChecked:true}, "Kept as a different unit"); return; }
  if(t.id === "fab"){ sheet = {type:"add"}; renderSheet(true); return; }
  if(t.dataset.open){ openUnit(t.dataset.open); return; }
  if(t.dataset.rate){ const id = t.dataset.rate, n = +t.dataset.n; const r = units.find(u => u.id === id); const cur = r ? ratingOf(r, me.key) : 0; const upd = {["ratings."+me.key]: cur === n ? 0 : n};
    if(r && noped(r, me.key)){ upd["nope."+me.key] = false; if(r.status === "Rejected" && r.nopeRejected){ upd.status = r.prevStatus || "Unviewed"; upd.nopeRejected = false; } }
    save(id, upd);
    if(r){ const nv = cur === n ? 0 : n; logAct(`act_rate_${me.key}_${id}`, nv ? {kind:"rate", by:me.key, unitId:id, unitName:r.name||"", n:nv} : null); if(noped(r, me.key)) logAct(`act_nope_${me.key}_${id}`, null); }
    return; }
  if(t.dataset.nope){ const r = units.find(u => u.id === t.dataset.nope); if(!r) return;
    const on = !noped(r, me.key); const upd = {["nope."+me.key]: on};
    if(on){ upd["ratings."+me.key] = 0;
      const both = KEYS.every(k => k === me.key || noped(r, k));
      if(both && r.status !== "Rejected"){ upd.status = "Rejected"; upd.prevStatus = r.status || "Unviewed"; upd.nopeRejected = true; upd.appt = ""; }
      save(r.id, upd, both ? "You both said no — moved to Rejected" : "Thumbs down saved");
      logAct(`act_nope_${me.key}_${r.id}`, {kind:"nope", by:me.key, unitId:r.id, unitName:r.name||"", text: both && r.status !== "Rejected" ? "You both said no — moved to Rejected" : ""});
      logAct(`act_rate_${me.key}_${r.id}`, null);
    } else {
      if(r.status === "Rejected" && r.nopeRejected){ upd.status = r.prevStatus || "Unviewed"; upd.nopeRejected = false; }
      save(r.id, upd, r.nopeRejected ? "Back in the list" : "Thumbs down removed");
      logAct(`act_nope_${me.key}_${r.id}`, null);
    }
    return; }
  if(t.dataset.filter){ filter = t.dataset.filter; render(); return; }
  if(t.id === "seeAllNew" || t.id === "seeUnrated"){ filter = t.id === "seeAllNew" ? "new" : "mine"; tab = "homes"; try{localStorage.setItem("hs-tab",tab);}catch(e){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.cmp){ const id = t.dataset.cmp; compare = compare.includes(id) ? compare.filter(x => x !== id) : compare.concat(id).slice(-3); try{localStorage.setItem("hs-cmp",JSON.stringify(compare));}catch(e){} render(); toast(compare.includes(id) ? "Added to Compare (" + compare.length + "/3)" : "Removed from Compare"); return; }
  if(t.id === "clearcmp"){ if(sheet && sheet.type === "cmp") closeSheet(); compare = []; try{localStorage.setItem("hs-cmp","[]");}catch(e){} render(); return; }
  if(t.dataset.check){ const r = units.find(u => u.id === t.dataset.check); if(!r) return; const c = t.dataset.c; save(r.id, {["checks."+ckey(c)]: !(r.checks||{})[ckey(c)]}); return; }
  if(t.dataset.untag){ const r = units.find(u => u.id === sheet.id); if(!r) return; const arr = (r[t.dataset.untag]||[]); save(r.id, {[t.dataset.untag]: FV.arrayRemove(arr[+t.dataset.i])}); return; }
});
document.addEventListener("input", ev => { if(ev.target.id === "q"){ query = ev.target.value; const el = $("homeList"); if(!el) return;
  el.innerHTML = homeList(homesFiltered(), query.trim()); } });
document.addEventListener("change", ev => { if(ev.target.id === "sort"){ sort = ev.target.value; render(); } });
document.addEventListener("keydown", ev => { if(ev.key === "Escape" && sheet) closeSheet(); });

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg => { swReg = reg; }).catch(()=>{});
checkForUpdate();
})();
</script>
