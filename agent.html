<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viewing board</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3F7D4E">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* The agent's permanent board: sections from "needs a time" to "closed", each home
   editable inline, changes since his last visit highlighted in kaya yellow. */
:root{--bg:#FBF8F5;--paper:#fff;--ink:#2A2226;--muted:#776A70;--line:#EDE4DE;--pandan:#3F7D4E;--pandan-soft:#E4F0E6;--kaya:#E9B949;--kaya-soft:#FBF1D6;--rose:#D9546E;--rose-soft:#FBE4E8;
  --shadow:0 1px 2px rgba(42,34,38,.06),0 6px 18px rgba(42,34,38,.06);--fd:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;--fb:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#17141A;--paper:#221D24;--ink:#F2ECEE;--muted:#B4A7AD;--line:#352D37;--pandan:#7CC492;--pandan-soft:#21352A;--kaya:#F0C766;--kaya-soft:#3A3120;--rose:#F07A92;--rose-soft:#3D2229;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 110px)}
h1{font:800 24px/1.15 var(--fd);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 6px}
h2.sec{font:700 18px var(--fd);margin:22px 0 4px;display:flex;gap:8px;align-items:baseline}
h2.sec small{font:500 13px var(--fb);color:var(--muted)}
.box{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-top:10px}
.box.changed{box-shadow:0 0 0 2px var(--kaya),var(--shadow)}
.box h3{font:700 17px/1.2 var(--fd);margin:0}
.box h4{font:700 12.5px var(--fb);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.chg{background:var(--kaya-soft);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:13px;font-weight:600}
.news{background:var(--kaya-soft);border-radius:14px;padding:12px 14px;margin-top:12px}
.news ul{margin:6px 0 0;padding-left:18px}
a{color:var(--pandan)}
.win{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}.win:last-child{border-bottom:none}.win.full{opacity:.5}
.warn{color:var(--ink);border-left:3px solid var(--kaya);background:var(--kaya-soft);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600;margin-top:6px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-size:13px;border-radius:999px;background:var(--pandan-soft);color:var(--pandan);padding:4px 10px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 6px;font-size:13px;font-weight:600;text-align:center;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--pandan);border-color:var(--pandan);color:#fff}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:10px}
input,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:15px;color:var(--ink);font-weight:400}
textarea{min-height:70px;resize:vertical}
.dt{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;font-size:15px;font-weight:400;color:var(--ink);min-height:42px}
.dt.empty{color:var(--muted)}
.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;padding:0}
.offer{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:8px}
.offer b{font-size:16px}
.pill{font:700 10.5px var(--fb);text-transform:uppercase;letter-spacing:.06em;border-radius:6px;padding:3px 7px;background:var(--line);color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px)}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.send{flex:1;border:none;border-radius:12px;background:var(--pandan);color:#fff;font-weight:700;font-size:16px;padding:13px;cursor:pointer}
.send:disabled{opacity:.55}
.ok{color:var(--pandan);font-weight:600;font-size:13px}
.err{color:var(--rose);font-size:13px}
[hidden]{display:none!important}
.prio{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;background:var(--rose-soft);color:var(--rose)}
.ask{margin-top:8px;font-size:13.5px;line-height:1.4;color:var(--ink);background:var(--kaya-soft);border-left:3px solid var(--kaya);border-radius:10px;padding:8px 10px}
.ask b{color:var(--ink)}
.spec{font-size:13px;color:var(--ink);font-weight:600;margin-top:2px}
.addview{margin-top:10px;background:none;border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;font:inherit;font-size:13.5px;width:100%;text-align:left;cursor:pointer}
.tom li{margin:4px 0}
.prio.newc{background:var(--pandan-soft);color:var(--pandan)}
.thread{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.tm{max-width:88%;padding:7px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;line-height:1.4;align-self:flex-start;white-space:pre-wrap}
.tm.me{align-self:flex-end;background:var(--pandan-soft);border-color:transparent}
.tm.new{border-color:var(--pandan)}
.tby{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.reply{display:flex;gap:6px;margin-top:8px;align-items:flex-end}
.reply textarea{flex:1;min-height:40px;margin:0}
.rsend{border:0;border-radius:10px;background:var(--pandan);color:#fff;font:inherit;font-weight:700;padding:10px 14px;cursor:pointer}
.linkbtn{background:none;border:0;padding:0;color:var(--pandan);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left}
.files{margin-top:10px;font-size:13px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:4px 8px 4px 4px;font:inherit;font-size:12.5px;color:inherit;cursor:pointer;max-width:100%}
.fchip img{width:32px;height:32px;object-fit:cover;border-radius:6px}.fico{width:32px;height:32px;display:grid;place-items:center;font-size:18px}
.fview{position:fixed;inset:0;z-index:50;background:#111;color:#eee;display:flex;flex-direction:column}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#1c1c1c}
.fsc{flex:1;overflow:auto;background:#fff;display:flex}.fsc img{max-width:100%;margin:auto}
.cardfoot{display:flex;gap:16px;margin-top:10px;font-size:13px}.linkbtn.muted{color:var(--muted)}
.avail summary{cursor:pointer;font-size:14px;line-height:1.45;list-style:none}.avail summary::-webkit-details-marker{display:none}.avail summary::after{content:" ▸";color:var(--muted)}.avail[open] summary::after{content:" ▾"}
.dropst{margin-top:10px;font-size:13px;background:var(--rose-soft);border-radius:10px;padding:8px 10px}
.dropst.keep{background:var(--pandan-soft)}
.dropui{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px}
.dropui .rs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dropui .opt{padding:7px 10px}
.dropui input{width:100%;box-sizing:border-box}
.slotbtn{margin-top:10px;width:100%;padding:10px;border-radius:12px;border:1px dashed currentColor;background:none;font:inherit;font-weight:600;color:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="previewBar" hidden style="position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--kaya-soft,#FBF1D6);border-bottom:1px solid rgba(0,0,0,.08);font-size:14px">
  <a href="./" style="font-weight:700;color:inherit;text-decoration:none;font-size:15px">‹ Back to our app</a><span style="flex:1"></span><span style="opacity:.7">Preview of Andrew's board</span></div>
<div class="wrap" id="root"><h1>Loading…</h1></div>
<div class="bar" id="bar" hidden><div class="in"><span id="msg" style="font-size:13px;flex:1"></span><button class="send" id="send" type="button" hidden>Try again</button></div></div>
<script src="config.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtWhen = s => { if(!s) return ""; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString("en-SG",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); };
const fmtM = m => typeof m === "number" ? "S$" + Math.round(m*1e6).toLocaleString("en-SG") : "";
function parseMoney(s){ const t = String(s||"").replace(/[S$,\s]/gi, "").toLowerCase(); if(!t) return null; let n = parseFloat(t); if(isNaN(n)) return null;
  if(/k$/.test(t)) n /= 1000; else if(!/m$/.test(t) && n > 1000) n /= 1e6; return Math.round(n*1e4)/1e4; }
const VIEW_MIN = 60;
const toMin = t => { const [hh, mm] = String(t||"0:0").split(":").map(Number); return hh*60 + (mm||0); };
const fmtT = t => { let [hh, mm] = String(t).split(":").map(Number); const ap = hh >= 12 ? "pm" : "am"; hh = hh % 12 || 12; return hh + (mm ? ":" + String(mm).padStart(2,"0") : "") + ap; };
const fmtDay = d => new Date(d + "T00:00").toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"});
const winLabel = w => typeof w === "string" ? w : `${fmtDay(w.date)}, ${fmtT(w.start)}–${fmtT(w.end)}${w.note ? " (" + w.note + ")" : ""}`;
const winEnded = w => typeof w !== "string" && new Date(w.date + "T" + w.end) < new Date();
function bookings(exceptId){ // viewings on the board (using his unsaved edits) + their other bookings
  const out = [];
  Object.entries(B.items || {}).forEach(([id, it]) => {
    if(id === exceptId || it.status === "closed") return;
    const s = state[id], at = s && s.state === "confirmed" && s.appt ? s.appt : (it.status === "upcoming" ? it.appt : "");
    if(at) out.push({at, label: it.name});
  });
  (B.busy || []).forEach(b => out.push({at: b.at, label: "another viewing"}));
  return out;
}
const inWin = (w, bk) => typeof w === "string" ? [] : bk.filter(b => b.at.slice(0,10) === w.date && toMin(b.at.slice(11,16)) >= toMin(w.start) && toMin(b.at.slice(11,16)) < toMin(w.end)).sort((a,b) => a.at.localeCompare(b.at));
const winFull = (w, ins) => typeof w !== "string" && ins.length >= Math.max(1, Math.floor((toMin(w.end) - toMin(w.start)) / VIEW_MIN));
function clash(id, at){ // warning text for a chosen time, or ""
  if(!at) return "";
  const it = (B.items || {})[id] || {};
  const alreadyOurs = it.status === "upcoming" && it.appt === at; // a booking they already have counts as agreed
  if(!["new","upcoming"].includes(it.status) || new Date(at) < new Date()) return ""; // viewed, offer, closed or past: nothing to warn about
  const wins = (B.free || []).filter(w => typeof w !== "string");
  const msgs = [];
  if(!alreadyOurs && wins.length && !wins.some(w => at.slice(0,10) === w.date && toMin(at.slice(11,16)) >= toMin(w.start) && toMin(at.slice(11,16)) + VIEW_MIN <= toMin(w.end) + 0))
    msgs.push("Outside the times they're free — please check with them first.");
  const t = new Date(at).getTime();
  const near = bookings(id).filter(b => Math.abs(new Date(b.at).getTime() - t) < VIEW_MIN*60000);
  if(near.length) msgs.push("Within an hour of " + near.map(b => b.label + " at " + fmtT(b.at.slice(11,16))).join(", ") + ".");
  return msgs.join(" ");
}
function availHTML(){
  const live = (B.free || []).filter(w => !winEnded(w));
  const bk = bookings(null);
  const outside = bk.filter(b => new Date(b.at) > new Date() && !live.some(w => inWin(w, [b]).length)).sort((a,b) => a.at.localeCompare(b.at));
  if(!live.length && !outside.length) return `<div class="box"><h4>When they're free</h4><p class="meta" style="margin:0">No times shared yet.</p>${B.slotAsk ? `<div class="ask" style="margin-top:10px">✓ You asked for viewing slots — they'll add times.</div>` : `<button class="slotbtn" type="button" id="slotBtn">🙋 Ask them for viewing slots</button>`}</div>`;
  const slot = B.slotAsk ? `<div class="ask" style="margin-top:10px">✓ You asked for more slots${B.slotAsk.note ? ` (“${esc(B.slotAsk.note)}”)` : ""} — they'll add more times.</div>` : slotOpen ? `<div style="margin-top:10px"><label>Anything specific? (optional)<input id="slotNote" maxlength="160" placeholder="e.g. Seller only free weekday evenings"></label><button class="send" type="button" id="slotSend" style="margin-top:8px;width:100%">Ask for more viewing slots</button></div>` : `<button class="slotbtn" type="button" id="slotBtn">🙋 Need more viewing slots?</button>`;
  const merged = []; // "Sat 31 Oct, 10am–12pm" when two windows touch
  live.filter(w => typeof w !== "string").sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start)).forEach(w => { const m = merged[merged.length-1]; if(m && m.date === w.date && m.end === w.start) m.end = w.end; else merged.push(Object.assign({}, w)); });
  const brief = merged.map(w => `${new Date(w.date + "T00:00").toLocaleDateString("en-SG",{weekday:"short",day:"numeric",month:"short"})} ${fmtT(w.start)}–${fmtT(w.end)}`).concat(live.filter(w => typeof w === "string")).join(" · ");
  return `<details class="box avail" ${availOpen ? "open" : ""} id="availD"><summary><b>Free:</b> ${esc(brief) || "—"}${outside.length ? ` <span class="meta">+${outside.length} other viewing${outside.length>1?"s":""}</span>` : ""}</summary><p class="meta" style="margin:8px 0 4px">Each viewing is planned as 1 hour, including travel.</p>${live.map(w => { const ins = inWin(w, bk), full = winFull(w, ins);
    return `<div class="win ${full?"full":""}"><b>${esc(winLabel(w))}</b>${full?` <span class="pill">Fully booked</span>`:""}${ins.length?`<div class="meta">Booked: ${ins.map(b => esc(fmtT(b.at.slice(11,16)) + " " + b.label)).join(" · ")}</div>`:""}</div>`; }).join("")}${outside.length ? `<div class="win"><b>Other confirmed viewings</b><div class="meta">${outside.map(b => esc(fmtWhen(b.at) + " " + b.label)).join(" · ")}</div></div>` : ""}${slot}</details>`;
}
const token = (location.hash || "").replace(/^#/, "");
const PREVIEW = /[?&]preview=1/.test(location.search); // opened from our app: show a way back, don't mark Andrew's visit
if(PREVIEW) document.getElementById("previewBar").hidden = false;
const root = $("root");
if(!/^[A-Za-z0-9]{24,}$/.test(token)){ root.innerHTML = `<h1>Link not recognised</h1><p class="sub">Please use the full link from the WhatsApp message.</p>`; return; }

// Plain HTTPS to Firestore (no SDK) so it works in WhatsApp's and other in-app browsers.
const FB = window.HOME_SHORTLIST.firebase;
const BASE = `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
const DOC = `projects/${FB.projectId}/databases/(default)/documents/hs_board/${token}`;
const dec = v => { const [t, x] = Object.entries(v)[0];
  if(t === "nullValue") return null; if(t === "integerValue" || t === "doubleValue") return Number(x);
  if(t === "timestampValue") return new Date(x);
  if(t === "arrayValue") return (x.values || []).map(dec);
  if(t === "mapValue") return Object.fromEntries(Object.entries(x.fields || {}).map(([k, y]) => [k, dec(y)]));
  return x; };
const enc = v => v === null || v === undefined ? {nullValue: null} : typeof v === "boolean" ? {booleanValue: v}
  : typeof v === "number" ? {doubleValue: v} : typeof v === "string" ? {stringValue: v}
  : Array.isArray(v) ? {arrayValue: {values: v.map(enc)}} : {mapValue: {fields: Object.fromEntries(Object.entries(v).map(([k, y]) => [k, enc(y)]))}};
async function call(url, opts){
  for(let i = 0; i < 3; i++){
    try { const r = await fetch(url, opts); if(r.status >= 500) throw new Error("server " + r.status); return r; }
    catch(e){ if(i === 2) throw e; await new Promise(z => setTimeout(z, 800 * (i + 1))); }
  }
}
const commit = (fields, mask, transforms, keepalive) => call(`${BASE}:commit?key=${FB.apiKey}`, {method:"POST", keepalive: !!keepalive, headers:{"Content-Type":"application/json"},
  body: JSON.stringify({writes: [{update: {name: DOC, fields}, updateMask: {fieldPaths: mask}, updateTransforms: transforms.map(f => ({fieldPath: f, setToServerValue: "REQUEST_TIME"})), currentDocument: {exists: true}}]})});

const SECTIONS = [["new","Needs a viewing time","New homes, or ones still to be scheduled"],["upcoming","Upcoming viewings",""],["offer","Offers","Our offers and the seller's response"],["viewed","Viewed","Share anything new after the viewing"],["closed","Closed","No need to follow up"]];
const STATES = [["confirmed","✅ Confirmed"],["pending","⏳ Checking"],["sold","🏷️ Sold"]];
let viewOpen = new Set(), availOpen = false;
let B = null, state = {}, lastSeen = 0, dirty = false, suggestDraft = {url:"", note:""}, slotOpen = false;
function wireSlots(){
  const d = $("availD"); if(d) d.ontoggle = () => { availOpen = d.open; };
  const b = $("slotBtn"); if(b) b.onclick = () => { slotOpen = true; availOpen = true; const a = $("avail"); a.innerHTML = availHTML(); wireSlots(); const n = $("slotNote"); if(n) n.focus(); };
  const s = $("slotSend"); if(s) s.onclick = async () => {
    s.disabled = true; s.textContent = "Sending…";
    const note = ($("slotNote").value || "").trim().slice(0,160);
    const suggestions = (B.suggestions || []).concat([{kind:"slots", note, at:new Date().toISOString()}]);
    try { const r = await commit({suggestions: enc(suggestions)}, ["suggestions"], ["replyAt"]); if(!r.ok) throw new Error("http " + r.status);
      B.suggestions = suggestions; B.slotAsk = {note, at:new Date().toISOString()}; slotOpen = false; $("avail").innerHTML = availHTML(); wireSlots(); }
    catch(e){ s.disabled = false; s.textContent = "Couldn't send — try again"; }
  };
}

call(`${BASE}/hs_board/${token}?key=${FB.apiKey}`).then(async r => {
  if(r.status === 403 || r.status === 404){ const e = new Error("gone"); e.gone = true; throw e; }
  if(!r.ok) throw new Error("http " + r.status);
  const d = await r.json(); B = dec({mapValue: {fields: d.fields || {}}});
  lastSeen = B.agentSeenAt ? B.agentSeenAt.getTime() : 0;
  const R = B.replies || {};
  Object.keys(B.items || {}).forEach(id => { const p = R[id] || {}, it = B.items[id], up = it.status === "upcoming" && it.appt;
    state[id] = {state: up ? "confirmed" : (p.state || "pending"), appt: up ? it.appt : (p.appt || ""), view: p.view || "", counter: p.counter || null, msgs: (p.msgs || []).slice(), drop: p.drop || null, draft: ""}; });
  render(); $("bar").hidden = false; $("msg").innerHTML = `<span class="meta">${PREVIEW ? "Preview — taps here aren't saved." : "Everything you change saves by itself."}</span>`;
  if(!PREVIEW) commit({}, [], ["agentSeenAt"]).catch(() => {}); // mark this visit (not when we preview it)
}).catch(e => {
  root.innerHTML = e && e.gone
    ? `<h1>This link no longer works</h1><p class="sub">Please ask Adrian for the latest link.</p>`
    : `<h1>Couldn't load</h1><p class="sub">Please check your connection and <a href="" onclick="location.reload();return false">try again</a>. If it keeps happening, open the link in Safari or Chrome.</p>`;
});

/* Attachments: floor plans and other files from seller agents. Each file is its own small
   record under this board (images shrunk on the phone, PDFs up to ~700 KB); the board keeps
   a short list with a tiny thumbnail so cards can show what's been sent. */
const FILE_MAX = 980000; // chars of data URL (~730 KB)
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
function readAs(file){ return new Promise((ok, bad) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => bad(new Error("read")); fr.readAsDataURL(file); }); }
function drawImg(img, side, q){ const k = Math.min(1, side / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", q); }
function loadImg(src){ return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("not an image")); i.src = src; }); }
async function prepFile(file){
  const name = (file.name || "file").slice(0, 120);
  if(file.type === "application/pdf"){
    const d = await readAs(file); if(d.length > FILE_MAX) throw new Error("too big");

    B.replies = replies;
    const waiting = Object.entries(state).filter(([id, s]) => s.state === "confirmed" && !s.appt && (B.items[id]||{}).status !== "offer" && (B.items[id]||{}).status !== "closed");
    status(waiting.length ? `<span class="err">Pick a date &amp; time for ${esc(waiting.map(([id]) => B.items[id].name).join(", "))} — it saves once you do.</span>` : `<span class="ok">✓ All changes saved — ${esc(B.from || "Adrian")} &amp; Shernice can see them.</span>`);
  } catch(e){
    dirty = true; status(`<span class="err">Couldn't save — check your connection.</span>`); $("send").hidden = false;
  } finally {
    saving = false;
    if(again){ again = false; if(dirty) saveNow(); }
  }
}
$("send").onclick = () => { $("send").hidden = true; dirty = true; saveNow(); };
async function sendSuggestion(){
  const sg = suggestDraft.url.trim(), m = $("sgMsg");
  if(PREVIEW){ m.innerHTML = `<span class="meta">Preview only — not sent.</span>`; return; }
  if(!/^https?:\/\/\S+\.\S+/.test(sg)){ m.innerHTML = `<span class="err">Paste the full listing link (starting with https://).</span>`; return; }
  const b = $("sgSend"); b.disabled = true; b.textContent = "Sending…";
  const suggestions = (B.suggestions || []).concat([{url: sg, note: suggestDraft.note.trim().slice(0,200), at: new Date().toISOString()}]);
  try { const r = await commit({suggestions: enc(suggestions)}, ["suggestions"], ["replyAt"]); if(!r.ok) throw new Error("http " + r.status);
    B.suggestions = suggestions; suggestDraft = {url:"", note:""}; const y = scrollY; render(); scrollTo(0, y); $("sgMsg").innerHTML = `<span class="ok">✓ Sent — thanks!</span>`; }
  catch(e){ b.disabled = false; b.textContent = "Send suggestion"; m.innerHTML = `<span class="err">Couldn't send — try again.</span>`; }
}
function sendDraft(id){
  const st = state[id], t = (st.draft || "").trim(); if(!t) return false;
  st.msgs = (st.msgs || []).concat([{text: t.slice(0,800), at: new Date().toISOString()}]); st.draft = ""; return true;
}
const flushDrafts = () => { let any = false; Object.keys(state).forEach(id => { if(sendDraft(id)) any = true; }); if(any && !PREVIEW) dirty = true; };
// Leaving the page: send unsent replies and save anything still waiting.
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden"){ flushDrafts(); if(dirty) saveNow(true); } });
window.addEventListener("pagehide", () => { flushDrafts(); if(dirty) saveNow(true); });
window.addEventListener("beforeunload", e => { if(dirty || saving){ saveNow(true); e.preventDefault(); e.returnValue = ""; } });
})();
</script>
